events {}

http {
    upstream frontend_app {
        server service-a:5000;
    }

    server {
        listen 80;
        

        location / {
            proxy_pass http://frontend_app;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8080;
        location /metrics {
            stub_status on;
            access_log off;
        }
    }
}