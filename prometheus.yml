global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'voting-app'
    static_configs:
      - targets: ['service-a:5000', 'service-b:5000']
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: 'postgres'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres-exporter:9187']

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
rule_files:
  - "alert_rules.yml"