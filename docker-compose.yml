services:
  service_a:
    build: ./service_a
    environment:
      - OTEL_SERVICE_NAME=voting-frontend
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      # --- НАСТРОЙКИ ОПРОСА ---
      - POLL_TITLE=Cats vs Dogs
      - OPTION_A=Cats
      - OPTION_B=Dogs
    depends_on:
      - jaeger
      - service_b

  service_b:
    build: ./service_b
    environment:
      - OTEL_SERVICE_NAME=voting-backend
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OPTION_A=Cats
      - OPTION_B=Dogs
      - DB_HOST=postgres
      - DB_NAME=voting_db
      - DB_USER=voting_user
      - DB_PASSWORD=voting_password
      - WERKZEUG_SERVER_NAME=service_b:5000
    depends_on:
      - jaeger
      - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=voting_db
      - POSTGRES_USER=voting_user
      - POSTGRES_PASSWORD=voting_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Пароль от админки

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - service_a

volumes:
  postgres_data: