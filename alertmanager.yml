global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'telegram-bot'

receivers:
  - name: 'telegram-bot'
    telegram_configs:
      - bot_token: '${tg_bot_token}'
        chat_id: ${CHAT_ID}
        send_resolved: true 
        parse_mode: 'HTML'